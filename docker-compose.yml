services:
  postgres:
    image: postgres:14-alpine
    container_name: fretebr_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fretebr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fretebr123}
      POSTGRES_DB: ${DB_NAME:-fretebr_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fretebr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fretebr_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-fretebr}:${DB_PASSWORD:-fretebr123}@postgres:5432/${DB_NAME:-fretebr_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WHATSAPP_SANDBOX_ENABLED: ${TWILIO_WHATSAPP_SANDBOX_ENABLED:-true}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      WHATSAPP_NOTIFICATIONS_ENABLED: ${WHATSAPP_NOTIFICATIONS_ENABLED:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fretebr_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
