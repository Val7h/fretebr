<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="FreteBR — marketplace que conecta motoristas e clientes que precisam mandar carga. Encontre fretes ou poste o seu em minutos." />

    <!-- Open Graph (preview no WhatsApp / redes sociais) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FreteBR — Marketplace de Fretes" />
    <meta property="og:description" content="Encontre motoristas ou poste fretes em minutos. Beta privado, grátis." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:locale" content="pt_BR" />

    <title>FreteBR — Marketplace de Fretes</title>

    <style>
      /* Reset basico + fontes */
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background: #f5f6fa;
        color: #1a1a1a;
      }
      /* Inputs nao zoam ao focar no iOS */
      input, select, textarea { font-size: 16px; }
      /* Botoes sem aparencia nativa zoada */
      button { font-family: inherit; }
      /* Loader inicial (some quando React monta) */
      .initial-loader {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white; font-weight: 600;
        z-index: 9999;
        animation: fadeOut 0.4s 0.6s forwards;
      }
      @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
      .initial-loader .spinner {
        width: 48px; height: 48px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
        <div>Carregando FreteBR...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
