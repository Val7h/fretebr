<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 🔧 Sem cache durante desenvolvimento -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>FreteBR - Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- 🔧 Force clear cache e redireciona para dashboard -->
    <script>
      // Limpar localStorage e sessionStorage
      localStorage.clear();
      sessionStorage.clear();

      // Registrar service worker para limpar cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(reg => reg.unregister());
        });
      }

      // Redirecionar para dashboard se não está lá
      if (!window.location.pathname.includes('/dashboard') && !window.location.pathname.includes('/')) {
        window.location.href = '/dashboard';
      }
    </script>
  </body>
</html>
