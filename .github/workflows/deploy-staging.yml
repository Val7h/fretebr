name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.fretebr.com.br
    steps:
      - uses: actions/checkout@v4

      # Placeholder - substituir pelo provider escolhido:
      # - Fly.io: superfly/flyctl-actions
      # - Render: usar webhook deploy hook
      # - Railway: railway/cli-action
      # - AWS ECS: aws-actions/amazon-ecs-deploy-task-definition

      - name: Deploy Backend (Fly.io exemplo)
        if: ${{ env.FLY_API_TOKEN != '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "${{ secrets.FLY_API_TOKEN }}" | $HOME/.fly/bin/flyctl auth token
          cd backend && $HOME/.fly/bin/flyctl deploy --remote-only

      - name: Run Alembic migrations on staging
        if: ${{ env.FLY_API_TOKEN != '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd backend && $HOME/.fly/bin/flyctl ssh console --command "python -m alembic upgrade head"

      - name: Notify deploy
        if: success()
        run: echo "Deploy staging concluido"
