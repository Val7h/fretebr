name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # BACKEND - LINT + IMPORT CHECK
  # ============================================================
  backend-lint:
    name: Backend - Lint & Import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff (lint)
        working-directory: backend
        # Lint deve falhar build; usar --exit-non-zero-on-fix=false pra warnings
        run: ruff check app/ --select E,F,W --ignore E501,W291,W293

      - name: Import smoke test
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-production-use
          DATABASE_URL: sqlite:///./ci.db
        run: python -c "from app.main import app; print('IMPORT OK')"

  # ============================================================
  # BACKEND - E2E TESTS (SQLite + Postgres)
  # ============================================================
  backend-tests:
    name: Backend - E2E Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: fretebr
          POSTGRES_PASSWORD: fretebr_ci
          POSTGRES_DB: fretebr_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Set DATABASE_URL (sqlite)
        if: matrix.db == 'sqlite'
        run: echo "DATABASE_URL=sqlite:///./fretebr_ci.db" >> $GITHUB_ENV

      - name: Set DATABASE_URL (postgres)
        if: matrix.db == 'postgres'
        run: echo "DATABASE_URL=postgresql+psycopg2://fretebr:fretebr_ci@localhost:5432/fretebr_ci" >> $GITHUB_ENV

      - name: Run Alembic migrations
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-production-use
        run: python -m alembic upgrade head

      - name: Start backend (background)
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-production-use
        run: |
          nohup python -m uvicorn app.main:app --port 8001 > /tmp/be_ci.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8001/health > /dev/null; then
              echo "Backend up"
              break
            fi
            echo "Waiting for backend... $i"
            sleep 1
          done

      - name: P1 — Rate limit, refresh, state machine
        run: python scripts/tests/test_p1.py

      - name: P2 — Pix payment flow
        run: python scripts/tests/test_p2_payment.py

      - name: P3 — Observability + cookies
        run: python scripts/tests/test_p3.py

      - name: P4 — Postgres + cookie mode + CI structure
        run: python scripts/tests/test_p4.py

      - name: Bot suite (regression)
        run: python scripts/tests/test_bots_completo.py

      - name: Backend logs (on failure)
        if: failure()
        run: tail -200 /tmp/be_ci.log

  # ============================================================
  # FRONTEND - BUILD + TYPECHECK
  # ============================================================
  frontend:
    name: Frontend - Build & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeCheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8001/api
        run: npm run build

      - name: Upload bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # CODEQL SECURITY SCAN (gratis no GH)
  # ============================================================
  security-scan:
    name: Security - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
